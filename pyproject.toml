[project]
name = "kba"
version = "0.1.0"
description = "Engineering Knowledge Assistant — local-first retrieval over technical documents with verifiable citations."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

# Development-only tooling. Runtime dependencies stay empty: `kba` itself
# must never require these. (pytest has its own transitive dependencies;
# pytest is the only direct dev dependency added here.)
[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
